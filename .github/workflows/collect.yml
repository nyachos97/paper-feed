name: 논문 후보 수집

on:
  schedule:
    # GitHub cron은 UTC 기준입니다. 19:40 UTC = 한국 04:40, 일~목(UTC) = 한국 월~금
    - cron: "40 19 * * 0-4"
    # 첫 실행이 지연·실패했을 때를 위한 보조 실행(한국 05:15). 같은 날 파일에 합쳐집니다.
    - cron: "15 20 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 후보 수집
        id: collect
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python collector/collect.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "paper-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "후보 수집 $(TZ=Asia/Seoul date +%F_%H%M)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::모든 수집 경로(OpenAlex·Crossref)가 실패했습니다. Claude 예약 작업이 직접 수집으로 대체합니다."
